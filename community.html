<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community & Media | tradewithalix</title>
    <style>
        body {
            background-color: #0b1120;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        h1, h2 {
            color: #ffffff;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 15px;
            margin-bottom: 40px;
        }
        .card {
            background: #172136;
            border-radius: 8px;
            overflow: hidden;
            padding: 10px;
        }
        .card img, .card iframe {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 6px;
        }
        .card-title {
            font-weight: bold;
            margin-top: 10px;
            font-size: 14px;
        }
        .card-desc {
            font-size: 12px;
            color: #9ca3af;
            margin-top: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Community and media</h1>
    <p style="color: #9ca3af;">Follow Alix on YouTube for lessons, join Telegram for notes and questions.</p>

    <!-- Section 1: Videos -->
    <h2>Watch Alix</h2>
    <div class="grid">
        <div class="card">
            <!-- Frame mein apne YouTube video ka embed link daalein -->
            <iframe src="https://www.youtube.com/embed/YOUR_VIDEO_ID_1" frameborder="0" allowfullscreen></iframe>
            <div class="card-title">At the trading desk</div>
            <div class="card-desc">Short clips from the desk</div>
        </div>
        <div class="card">
            <iframe src="https://www.youtube.com/embed/YOUR_VIDEO_ID_2" frameborder="0" allowfullscreen></iframe>
            <div class="card-title">On the road in Dubai</div>
            <div class="card-desc">Events and travel</div>
        </div>
    </div>

    <!-- Section 2: Moments / Images -->
    <h2>Moments</h2>
    <div class="grid">
        <div class="card">
            <img src="images/trading-desk.jpg" alt="Arshad Ali at his trading desk">
            <div class="card-title">Arshad Ali at his trading desk</div>
            <div class="card-desc">Trading desk</div>
        </div>
        <div class="card">
            <img src="images/forex-summit.jpg" alt="Forex Traders Summit Dubai">
            <div class="card-title">Arshad Ali at Forex Traders Summit</div>
            <div class="card-desc">Dubai Event</div>
        </div>
    </div>
</div>

</body>
</html>
